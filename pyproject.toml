[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exotrace"
version = "0.1.0"
description = "An evidence-grounded scientific investigation assistant for exoplanet data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.0",
  "requests>=2.32,<3.0",
  "neo4j>=5.28,<7.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]
vector = [
  "beautifulsoup4>=4.12,<5.0",
  "faiss-cpu>=1.9,<2.0",
  "rank-bm25>=0.2.2,<0.3",
  "sentence-transformers>=3.4,<6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
